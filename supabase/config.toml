# Regenerated by Claude on 2026-09-05.
# supabase/config.toml was missing from this project (confirmed: no local
# .git history to restore from, and the file wasn't present on disk).
# This is a standard, minimal default matching Supabase CLI's own
# `supabase init` template, with project_id set to match this folder
# ("yangi23") so container names line up with what your previous
# `supabase start` runs produced (supabase_db_yangi23, etc.).
#
# Nothing here is customized beyond project_id and auth.site_url (set to
# match this project's Vite dev server on :5173, per README.md). If your
# original config.toml had custom ports, extra auth providers, storage
# buckets, or edge function settings, this won't reproduce those — let
# Claude know and it can be adjusted.

project_id = "yangi23"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Disabled for local dev only: this CPU (Intel Pentium Gold 6405U) has no
# AVX/AVX2/AVX-512 (confirmed via /proc/cpuinfo inside WSL2), and the
# supabase/realtime container's Erlang/OTP runtime hits SIGILL (exit 132)
# on this hardware. Postgres, Auth, REST, Storage and Studio are unaffected
# (confirmed: your original run completed "Running migrations" before
# Realtime was even started, so Postgres + your migrations' extensions
# already run fine on this CPU). This flag only controls the LOCAL
# `supabase start` stack — it does not touch your linked/production
# Supabase Cloud project, migrations, or `supabase db push`. Flip back to
# true if a compatible Realtime image is found, or on different hardware.
enabled = false
ip_version = "IPv6"

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_manual_linking = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
