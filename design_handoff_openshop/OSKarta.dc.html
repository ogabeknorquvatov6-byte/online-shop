<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-card="{{ p.id }}" onPointerMove="{{ p.tiltMove }}" onPointerDown="{{ p.tiltDown }}" onPointerUp="{{ p.tiltRest }}" onPointerLeave="{{ p.tiltRest }}" onPointerCancel="{{ p.tiltRest }}" style="height:100%; animation:os-up 300ms cubic-bezier(0.22,1,0.36,1) both; animation-delay:{{ p.delay }};">
  <article style="position:relative; display:flex; flex-direction:column; height:100%; overflow:hidden; border-radius:12px; border:1px solid #e6e5e2; background:#fff; box-shadow:0 1px 2px 0 rgb(24 23 22 / 0.04), 0 4px 16px -6px rgb(24 23 22 / 0.10); font-family:Inter, system-ui, sans-serif;">
    <div data-media="" onClick="{{ p.onOpen }}" style="position:relative; aspect-ratio:1 / 1; overflow:hidden; cursor:pointer; background:repeating-linear-gradient(135deg, #f1f1ef 0 7px, #e6e5e2 7px 14px);">
      <div style="position:absolute; inset:0; display:flex; align-items:flex-end; padding:8px 8px 10px; font-family:ui-monospace, Menlo, monospace; font-size:12px; line-height:1.3; color:#57544e; opacity:{{ p.imgOpacity }};">{{ p.img }}</div>
      <span aria-hidden="true" style="position:absolute; inset:0; z-index:1; pointer-events:none; background-image:linear-gradient(105deg, transparent 38%, rgba(255,255,255,0.55) 50%, transparent 62%); animation:os-shine 1.1s linear 0.18s 1 both;"></span>
      <div style="position:absolute; left:8px; top:8px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; pointer-events:none; z-index:2;">
        <sc-if value="{{ p.hasDisc }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex; border-radius:6px; background:#c2410c; color:#fff; font-weight:700; font-size:12px; line-height:20px; padding:2px 6px; box-shadow:0 4px 14px -4px rgb(234 97 0 / 0.9);">−{{ p.discount }}%</span></sc-if>
        <sc-if value="{{ p.showNew }}" hint-placeholder-val="{{ false }}"><span style="border-radius:6px; background:#181716; color:#fff; font-weight:600; font-size:12px; line-height:20px; padding:2px 6px;">Yangi</span></sc-if>
      </div>
      <sc-if value="{{ p.showQuick }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ p.onQuick }}" style="position:absolute; left:8px; right:8px; bottom:8px; z-index:3; height:36px; display:flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:8px; background:rgb(255 255 255 / .92); color:#292825; font:600 14px Inter, system-ui, sans-serif; cursor:pointer; box-shadow:0 1px 3px rgba(23,20,17,0.18); opacity:0.94; transition:transform 140ms cubic-bezier(0.22,1,0.36,1), opacity 140ms;" style-hover="opacity:1;" style-active="transform:translateY(1px) scale(0.98);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"></path><circle cx="12" cy="12" r="3"></circle></svg>Tezkor koʻrish</button></sc-if>
      <sc-if value="{{ p.isOut }}" hint-placeholder-val="{{ false }}"><div style="position:absolute; inset:auto 0 0 0; z-index:2; background:rgb(24 23 22 / 0.78); color:#fff; text-align:center; font-size:12px; font-weight:600; padding:6px 0;">Sotuvda yoʻq</div></sc-if>
      <button type="button" onClick="{{ p.onFav }}" aria-label="Sevimlilarga qoʻshish" style="position:absolute; right:2px; top:2px; z-index:3; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border:0; background:transparent; padding:0; cursor:pointer; transition:transform 140ms cubic-bezier(0.22,1,0.36,1);" style-active="transform:scale(0.85);">
        <sc-if value="{{ p.fav }}" hint-placeholder-val="{{ false }}"><span style="position:relative; width:32px; height:32px; border-radius:999px; background:#ea6100; color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgb(0 0 0 / .1);"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg><span data-ring="" style="position:absolute; inset:0; border-radius:999px; box-shadow:0 0 0 2px #f97316; opacity:0; pointer-events:none;"></span></span></sc-if>
        <sc-if value="{{ p.notFav }}" hint-placeholder-val="{{ true }}"><span style="position:relative; width:32px; height:32px; border-radius:999px; background:rgb(255 255 255 / .88); color:#57544e; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(23,20,17,0.18);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg><span data-ring="" style="position:absolute; inset:0; border-radius:999px; box-shadow:0 0 0 2px #f97316; opacity:0; pointer-events:none;"></span></span></sc-if>
      </button>
    </div>
    <div style="display:flex; flex:1; flex-direction:column; padding:10px 10px 10px;">
      <p style="margin:0; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.04em; color:#78756e;">{{ p.brand }}</p>
      <h3 onClick="{{ p.onOpen }}" style="margin:4px 0 0; font-size:14px; font-weight:500; line-height:1.35; color:#181716; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; letter-spacing:-0.01em;">{{ p.name }}</h3>
      <sc-if value="{{ p.hasRating }}" hint-placeholder-val="{{ true }}">
        <p style="margin:5px 0 0; display:flex; align-items:center; gap:4px; font-size:12px; line-height:1; color:#78756e;"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fbbf24" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><span style="font-weight:600; color:#403e39; font-variant-numeric:tabular-nums;">{{ p.ratingText }}</span><span style="font-variant-numeric:tabular-nums;">{{ p.reviewsText }}</span></p>
      </sc-if>
      <div style="margin-top:auto; padding-top:8px;">
        <sc-if value="{{ p.hasDisc }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-wrap:wrap; align-items:baseline; gap:0 6px;"><span style="font-size:16px; font-weight:700; letter-spacing:-0.02em; color:#181716;">{{ p.priceText }}</span><span style="font-size:12px; color:#78756e; text-decoration:line-through;">{{ p.oldText }}</span></div>
          <p style="margin:2px 0 0; font-size:12px; font-weight:600; color:#047857;">{{ p.saveText }}</p>
        </sc-if>
        <sc-if value="{{ p.noDisc }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:16px; font-weight:700; letter-spacing:-0.02em; color:#181716;">{{ p.priceText }}</div>
        </sc-if>
        <sc-if value="{{ p.isIn }}" hint-placeholder-val="{{ true }}"><p style="margin:4px 0 0; display:flex; align-items:center; gap:4px; font-size:12px; font-weight:500; color:#047857;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Sotuvda bor</p></sc-if>
        <sc-if value="{{ p.isLow }}" hint-placeholder-val="{{ false }}"><p style="margin:4px 0 0; font-size:12px; font-weight:600; color:#b45309;">{{ p.lowText }}</p></sc-if>
        <sc-if value="{{ p.isOut }}" hint-placeholder-val="{{ false }}"><p style="margin:4px 0 0; font-size:12px; font-weight:500; color:#78756e;">Vaqtincha mavjud emas</p></sc-if>

        <sc-if value="{{ p.canAdd }}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{ p.onAdd }}" style="margin-top:8px; width:100%; height:44px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; border:1px solid #e6e5e2; background:#fff; color:#292825; font:600 14px Inter, system-ui, sans-serif; cursor:pointer; box-shadow:0 2px 0 0 #e6e5e2; transition:transform 140ms cubic-bezier(0.22,1,0.36,1), box-shadow 140ms cubic-bezier(0.22,1,0.36,1);" style-active="transform:translateY(2px) scale(0.985); box-shadow:0 0 0 0 #e6e5e2;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Savatga</button>
        </sc-if>
        <sc-if value="{{ p.inCart }}" hint-placeholder-val="{{ false }}">
          <div role="group" aria-label="{{ p.qtyAria }}" style="margin-top:8px; height:44px; display:flex; align-items:center; border-radius:8px; border:1px solid #a7f3d0; background:#ecfdf5; color:#047857; animation:os-swap 150ms cubic-bezier(0.22,1,0.36,1) both;">
            <button type="button" onClick="{{ p.onDec }}" aria-label="Bittaga kamaytirish" style="width:44px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:0; border-radius:8px 0 0 8px; background:transparent; color:#047857; cursor:pointer; transition:transform 140ms cubic-bezier(0.22,1,0.36,1);" style-active="transform:scale(0.85);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
            <span style="flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:5px; font:600 14px Inter, system-ui, sans-serif;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span style="overflow:hidden; height:18px;"><span data-roll-card="{{ p.id }}" style="display:block; line-height:18px; font-variant-numeric:tabular-nums;">{{ p.qty }}</span></span></span>
            <button type="button" onClick="{{ p.onInc }}" disabled="{{ p.atMax }}" aria-label="Bittaga koʻpaytirish" style="width:44px; height:42px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border:0; border-radius:0 8px 8px 0; background:transparent; color:{{ p.incC }}; cursor:pointer; transition:transform 140ms cubic-bezier(0.22,1,0.36,1);" style-active="transform:scale(0.85);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
          </div>
        </sc-if>
        <sc-if value="{{ p.isOut }}" hint-placeholder-val="{{ false }}">
          <button type="button" disabled="" style="margin-top:8px; width:100%; height:44px; border-radius:8px; border:1px solid #e6e5e2; background:#f8f8f7; color:#78756e; font:600 14px Inter, system-ui, sans-serif; cursor:not-allowed;">Sotuvda yoʻq</button>
        </sc-if>
      </div>
    </div>
  </article>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:190,&quot;height&quot;:360},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
