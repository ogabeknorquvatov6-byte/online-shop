<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="background:#181716; color:#d3d1cd; font-family:Inter, system-ui, sans-serif; font-size:14px;">
  <div style="max-width:1280px; margin:0 auto; padding:{{ padY }} {{ pad }} 24px;">
    <div style="display:grid; grid-template-columns:{{ trustCols }}; gap:12px;">
      <sc-for list="{{ trust }}" as="t" hint-placeholder-count="3">
        <div style="display:flex; align-items:center; gap:12px; padding:14px; border-radius:12px; background:rgb(255 255 255 / .05); border:1px solid rgb(255 255 255 / .08);">
          <span style="width:40px; height:40px; flex-shrink:0; border-radius:999px; background:rgb(234 97 0 / .16); color:#fb923c; display:flex; align-items:center; justify-content:center;">
            <sc-if value="{{ t.truck }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg></sc-if>
            <sc-if value="{{ t.back }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></sc-if>
            <sc-if value="{{ t.shield }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg></sc-if>
          </span>
          <span style="line-height:1.35;"><b style="display:block; color:#fff; font-size:14px;">{{ t.title }}</b><span style="font-size:14px; color:#a3a09a;">{{ t.sub }}</span></span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:32px; display:grid; grid-template-columns:{{ cols }}; gap:28px 24px;">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <span style="display:flex; align-items:center; gap:10px;"><span style="position:relative; width:30px; height:30px; border-radius:8px; background:#ea6100;"><span style="position:absolute; left:6px; top:6px; width:8px; height:8px; border-radius:2px; background:#fff;"></span><span style="position:absolute; right:6px; top:6px; width:8px; height:8px; border-radius:2px; background:#fff;"></span><span style="position:absolute; left:6px; bottom:6px; width:8px; height:8px; border-radius:2px; background:#fff;"></span><span style="position:absolute; right:6px; bottom:6px; width:8px; height:8px; border-radius:2px; background:#fff;"></span></span><span style="font-size:20px; font-weight:700; letter-spacing:-0.02em; color:#fff;">Open<span style="color:#fb923c;">Shop</span></span></span>
        <p style="margin:0; line-height:1.55; color:#a3a09a; max-width:300px;">Elektronika va maishiy texnika — rasmiy kafolat bilan, Toshkent boʻylab 1 kunda.</p>
        <a href="11 Kirish.dc.html" title="[SETTINGS: telegram_url]" style="align-self:flex-start; height:44px; padding:0 16px; display:inline-flex; align-items:center; gap:8px; border-radius:8px; background:#fff; color:#181716; font-weight:600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#229ed9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>Telegram bot</a>
      </div>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="display:flex; flex-direction:column;">
          <span style="margin-bottom:6px; font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#fff;">{{ g.title }}</span>
          <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="4"><a href="{{ l.href }}" style="min-height:36px; display:flex; align-items:center; color:#d3d1cd;" style-hover="color:#fdba74;">{{ l.label }}</a></sc-for>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:28px; padding-top:18px; border-top:1px solid rgb(255 255 255 / .08); display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; font-size:12px; color:#a3a09a;">
      <span>© 2026 OpenShop. Barcha huquqlar himoyalangan.</span>
      <span style="display:flex; flex-wrap:wrap; align-items:center; gap:6px;"><span data-ph="SETTINGS: phone" style="display:inline-block; font-family:ui-monospace, Menlo, monospace; font-size:.82em; line-height:1.45; background:#fef3c7; color:#92400e; border:1px dashed #d97706; border-radius:4px; padding:0 5px; white-space:nowrap;">[SETTINGS: phone]</span><span>· har kuni 09:00–21:00</span><span data-ph="SETTINGS: address" style="display:inline-block; font-family:ui-monospace, Menlo, monospace; font-size:.82em; line-height:1.45; background:#fef3c7; color:#92400e; border:1px dashed #d97706; border-radius:4px; padding:0 5px; white-space:nowrap;">[SETTINGS: address]</span></span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;bp&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;t&quot;,&quot;d&quot;],&quot;default&quot;:&quot;d&quot;,&quot;tsType&quot;:&quot;'m'|'t'|'d'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const bp = this.props.bp || 'm';
    return {
      pad: bp === 'd' ? '32px' : bp === 't' ? '24px' : '16px', padY: bp === 'm' ? '28px' : '40px',
      trustCols: bp === 'm' ? 'minmax(0,1fr)' : 'repeat(3, minmax(0,1fr))',
      cols: bp === 'd' ? '1.4fr 1fr 1fr 1fr' : bp === 't' ? 'repeat(2, minmax(0,1fr))' : 'minmax(0,1fr)',
      trust: [
        { truck: true, title: '1 kunda yetkazib berish', sub: 'Toshkent boʻylab; viloyatlarga 2–3 kun' },
        { back: true, title: '14 kun ichida qaytarish', sub: 'Original qadoq va kafolat taloni bilan' },
        { shield: true, title: 'Rasmiy kafolat', sub: 'Ishlab chiqaruvchi kafolat taloni bilan' },
      ],
      groups: [
        { title: 'Katalog', links: [['Telefonlar', '04 Katalog.dc.html'], ['Noutbuklar', '04 Katalog.dc.html'], ['Quloqchinlar', '04 Katalog.dc.html'], ['Maishiy texnika', '04 Katalog.dc.html']].map(([label, href]) => ({ label, href })) },
        { title: 'Xaridorlarga', links: [['Yetkazib berish', '14 Malumot sahifalari.dc.html'], ['Qaytarish va kafolat', '14 Malumot sahifalari.dc.html'], ['Buyurtma holati', '10 Kabinet.dc.html']].map(([label, href]) => ({ label, href })) },
        { title: 'Kompaniya', links: [['Biz haqimizda', '14 Malumot sahifalari.dc.html'], ['Aloqa', '14 Malumot sahifalari.dc.html']].map(([label, href]) => ({ label, href })) },
      ],
    };
  }
}
</script>
</body>
</html>
