<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Asosiy navigatsiya" style="position:absolute; left:0; right:0; bottom:0; z-index:40; background:rgb(255 255 255 / .96); border-top:1px solid #e6e5e2; font-family:Inter, system-ui, sans-serif;">
  <div style="position:relative; display:flex; max-width:640px; margin:0 auto;">
    <span aria-hidden="true" style="position:absolute; left:0; top:0; width:20%; height:100%; pointer-events:none; transform:translateX({{ navX }}); opacity:{{ lightOp }}; transition:transform 300ms cubic-bezier(0.34,1.3,0.64,1);">
      <span style="position:absolute; left:50%; top:8px; width:32px; height:32px; margin-left:-16px; border-radius:999px; background:#ea6100; box-shadow:0 2px 10px rgba(234,97,0,.45);"></span>
      <span style="position:absolute; left:22%; right:22%; bottom:2px; height:6px; border-radius:999px; background:rgb(249 115 22 / .6); filter:blur(4px);"></span>
    </span>
    <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
      <a href="{{ n.href }}" onPointerDown="{{ n.down }}" aria-label="{{ n.label }}" aria-current="{{ n.current }}" style="position:relative; flex:1; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px 0; transition:transform 150ms cubic-bezier(0.22,1,0.36,1);" style-active="transform:scale(0.95);">
        <span data-target="{{ n.key }}" style="position:relative; width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:{{ n.icon }};">
          <sc-if value="{{ n.isCubes }}" hint-placeholder-val="{{ false }}">
            <span data-cubes="" style="position:relative; width:20px; height:20px; perspective:220px;">
              <span data-cube="" style="position:absolute; left:6.5px; top:6.5px; width:7px; height:7px; border-radius:1.5px; background:currentColor; transform:translate(-4.5px,-4.5px);"></span>
              <span data-cube="" style="position:absolute; left:6.5px; top:6.5px; width:7px; height:7px; border-radius:1.5px; background:currentColor; transform:translate(4.5px,-4.5px);"></span>
              <span data-cube="" style="position:absolute; left:6.5px; top:6.5px; width:7px; height:7px; border-radius:1.5px; background:currentColor; transform:translate(-4.5px,4.5px);"></span>
              <span data-cube="" style="position:absolute; left:6.5px; top:6.5px; width:7px; height:7px; border-radius:1.5px; background:currentColor; transform:translate(4.5px,4.5px);"></span>
            </span>
          </sc-if>
          <sc-if value="{{ n.isHome }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></sc-if>
          <sc-if value="{{ n.isFav }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></sc-if>
          <sc-if value="{{ n.isCart }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg></sc-if>
          <sc-if value="{{ n.isUser }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></sc-if>
          <sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute; right:-9px; top:-5px; z-index:2; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:#c2410c; color:#fff; font-size:12px; font-weight:700; line-height:16px; text-align:center; box-shadow:0 0 0 2px #fff; overflow:hidden;"><span data-roll-count="" style="display:block;">{{ n.badge }}</span></span></sc-if>
        </span>
        <span style="font-size:12px; font-weight:{{ n.weight }}; line-height:1; color:{{ n.labelC }};">{{ n.label }}</span>
      </a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:60},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;catalog&quot;,&quot;fav&quot;,&quot;cart&quot;,&quot;user&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;favCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  componentDidUpdate() {
    const prev = this._prevCount; this._prevCount = this.props.cartCount;
    if (prev != null && prev !== this.props.cartCount && window.OS) document.querySelectorAll('[data-target="cart"] [data-roll-count]').forEach((el) => OS.roll(el));
  }
  renderVals() {
    const p = this.props, keys = ['home', 'catalog', 'fav', 'cart', 'user'];
    const idx = keys.indexOf(p.active || 'home');
    const def = [['home', 'Bosh sahifa', '03 Bosh sahifa.dc.html'], ['catalog', 'Katalog', '04 Katalog.dc.html'], ['fav', 'Sevimlilar', '09 Sevimlilar.dc.html'], ['cart', 'Savat', '07 Savat.dc.html'], ['user', 'Profil', '10 Kabinet.dc.html']];
    return {
      navX: (Math.max(idx, 0) * 100) + '%', lightOp: idx < 0 ? 0 : 1,
      items: def.map(([key, label, href], i) => {
        const on = i === idx, badge = key === 'cart' ? (p.cartCount || 0) : key === 'fav' ? (p.favCount || 0) : 0;
        return {
          key, label, href, current: on ? 'page' : undefined,
          isHome: key === 'home', isCubes: key === 'catalog', isFav: key === 'fav', isCart: key === 'cart', isUser: key === 'user',
          badge, hasBadge: badge > 0, icon: on ? '#fff' : '#78756e', labelC: on ? '#c2410c' : '#57544e', weight: on ? 600 : 500,
          down: key === 'catalog' ? (e) => window.OS && OS.burst(e.currentTarget.querySelector('[data-cubes]')) : undefined,
        };
      }),
    };
  }
}
</script>
</body>
</html>
